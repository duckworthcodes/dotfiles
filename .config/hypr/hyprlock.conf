general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/bright_ninja/Pictures/wallpaper.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.65
    vibrancy = 0.15
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"
    color = rgb(e8d2b0)
    font_size = 120
    font_family = JetBrainsMono Nerd Font
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgb(4242fa)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = hi, $USER
    color = rgb(c3a579)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(4242fa)
    inner_color = rgba(23233edd)
    font_color = rgb(e8d2b0)
    check_color = rgb(e8d2b0)
    fail_color = rgb(0c0ce9)
    fail_text = <i>wrong password ($ATTEMPTS)</i>
    placeholder_text = <span foreground="##c3a579">password...</span>
    fade_on_empty = false
    rounding = 16
    position = 0, -130
    halign = center
    valign = center
}
