## tabs
tab_bar_edge             top
tab_bar_style            fade
tab_fade                 1
active_tab_foreground    #3b2226
active_tab_background    #f94555
inactive_tab_foreground  #c9a27a
inactive_tab_background  #3b2226
tab_bar_background       #2a181c
dynamic_background_opacity yes
shell fish -C fastfetch

# theme colors
include colors.conf
