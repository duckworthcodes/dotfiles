add_newline = true

format = """
$directory$git_branch$git_status$python$nodejs$cmd_duration
$character"""

[directory]
style = "bold #d89764"
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "\ue0a0 "
style = "#c3a579"
format = "[$symbol$branch]($style) "

[git_status]
style = "#e8d2b0"
format = '([\[$all_status$ahead_behind\]]($style) )'

[python]
symbol = "\ue73c "
style = "#81bb95"
format = "[$symbol$version]($style) "

[nodejs]
symbol = "\ue718 "
style = "#81bb95"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "#c3a579"
format = "[took $duration]($style) "

[character]
success_symbol = "[❯](bold #d89764)"
error_symbol = "[❯](bold #c3a579)"
