add_newline = true

format = """
$directory$git_branch$git_status$python$nodejs$cmd_duration
$character"""

[directory]
style = "bold #f94555"
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "\ue0a0 "
style = "#c9a27a"
format = "[$symbol$branch]($style) "

[git_status]
style = "#f0d5a8"
format = '([\[$all_status$ahead_behind\]]($style) )'

[python]
symbol = "\ue73c "
style = "#8fa896"
format = "[$symbol$version]($style) "

[nodejs]
symbol = "\ue718 "
style = "#8fa896"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "#c9a27a"
format = "[took $duration]($style) "

[character]
success_symbol = "[❯](bold #f94555)"
error_symbol = "[❯](bold #c9a27a)"
